name: macOS build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to rebuild with the current workflow
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: macos-${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - name: Test calendar logic
        run: swift test

  package:
    needs: test
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && startsWith(inputs.release_tag, 'v'))
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      release_name: ${{ steps.release.outputs.name }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    env:
      CALDOCK_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
      CALDOCK_NOTARY_PROFILE: caldock-ci
      CALDOCK_RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - name: Validate tag and release version
        id: release
        run: |
          set -euo pipefail
          git show-ref --verify "refs/tags/$CALDOCK_RELEASE_TAG"
          env GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$CALDOCK_RELEASE_TAG" \
            python3 scripts/release-metadata.py --github-output "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$CALDOCK_RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Use HTTPS over TCP for Apple ticket delivery
        # GitHub reproduced HTTP/3 drops: actions/runner-images#14924.
        # This temporary network rule applies only to this hosted packaging VM.
        run: |
          set -euo pipefail
          printf '%s\n' 'block return out quick proto udp from any to any port 443' | sudo pfctl -f -
          sudo pfctl -E
      - name: Import signing and notarization credentials
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          export CALDOCK_NOTARY_KEYCHAIN="$RUNNER_TEMP/caldock-signing.keychain-db"
          printf 'CALDOCK_NOTARY_KEYCHAIN=%s\n' "$CALDOCK_NOTARY_KEYCHAIN" >> "$GITHUB_ENV"
          : "${CERTIFICATE_BASE64:?Missing certificate secret}"
          : "${CERTIFICATE_PASSWORD:?Missing certificate password secret}"
          : "${APPLE_ID:?Missing Apple ID secret}"
          : "${APPLE_APP_SPECIFIC_PASSWORD:?Missing Apple password secret}"
          : "${APPLE_TEAM_ID:?Missing team variable}"
          : "${CALDOCK_SIGN_IDENTITY:?Missing signing identity variable}"
          : "${SPARKLE_ED_PRIVATE_KEY:?Missing Sparkle update signing key secret}"
          umask 077
          sparkle_key_path="$RUNNER_TEMP/caldock-sparkle-key"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$sparkle_key_path"
          printf 'CALDOCK_SPARKLE_KEY_FILE=%s\n' "$sparkle_key_path" >> "$GITHUB_ENV"
          certificate_path="$RUNNER_TEMP/caldock-certificate.p12"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$CALDOCK_NOTARY_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$CALDOCK_NOTARY_KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$CALDOCK_NOTARY_KEYCHAIN"
          security import "$certificate_path" -P "$CERTIFICATE_PASSWORD" \
            -t cert -f pkcs12 -k "$CALDOCK_NOTARY_KEYCHAIN" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$CALDOCK_NOTARY_KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$CALDOCK_NOTARY_KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          xcrun notarytool store-credentials "$CALDOCK_NOTARY_PROFILE" \
            --keychain "$CALDOCK_NOTARY_KEYCHAIN" --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD"
          rm -f "$certificate_path"
      - name: Build, sign, notarize and staple ZIP and DMG
        run: env GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$CALDOCK_RELEASE_TAG" bash scripts/release.sh
      - name: Verify the distributed ZIP and DMG
        run: env GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$CALDOCK_RELEASE_TAG" python3 scripts/verify-release.py
      - name: Upload notarized app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.release.outputs.name }}
          path: |
            build/${{ steps.release.outputs.name }}.zip
            build/${{ steps.release.outputs.name }}.zip.sha256
            build/${{ steps.release.outputs.name }}.dmg
            build/${{ steps.release.outputs.name }}.dmg.sha256
            build/appcast.xml
          if-no-files-found: error
          retention-days: 30
      - name: Upload notarization report
        if: always() && steps.release.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.release.outputs.name }}-notarization
          path: |
            build/notarization.json
            build/notarization-log.json
            build/notarization-dmg.json
            build/notarization-dmg-log.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove credentials
        if: always()
        run: |
          keychain_path="$RUNNER_TEMP/caldock-signing.keychain-db"
          if [[ -f "$keychain_path" ]]; then
            security delete-keychain "$keychain_path"
          fi
          rm -f "$RUNNER_TEMP/caldock-certificate.p12"
          rm -f "$RUNNER_TEMP/caldock-sparkle-key"

  release:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified ZIP and DMG
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.package.outputs.release_name }}
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
          RELEASE_NAME: ${{ needs.package.outputs.release_name }}
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 -c "$RELEASE_NAME.zip.sha256"
          shasum -a 256 -c "$RELEASE_NAME.dmg.sha256"
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "CalDock $RELEASE_VERSION" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" --clobber \
            "$RELEASE_NAME.zip" "$RELEASE_NAME.zip.sha256" \
            "$RELEASE_NAME.dmg" "$RELEASE_NAME.dmg.sha256" appcast.xml
          gh release edit "$RELEASE_TAG" --draft=false
